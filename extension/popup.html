<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The console panel's menu: charcoal, orange for whatever is chosen. */
  :root { color-scheme: dark; --bg: #0a0b0d; --fg: #f3f4f5; --muted: #a9aeb6; --line: #343941; --accent: #ff6a13; --bad: #ff6b5c; --good: #9bd65a; }
  body { margin: 0; width: 340px; padding: 12px 14px; font: 500 15px/1.35 "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .015em; background: linear-gradient(200deg, #232830, var(--bg) 55%); color: var(--fg); }
  ::selection { background: var(--accent); color: var(--bg); }
  h1 { font-size: 22px; line-height: 1; margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; }
  h1 img { width: 28px; height: 28px; }
  strong { font-size: 17px; }
  label { display: block; margin: 8px 0 3px; color: var(--muted); }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 0; background: #050607; color: var(--fg); font: inherit; caret-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input { flex: 1; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 0; background: #1b1e23; color: var(--fg); font: 500 15px/1.25 "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button.primary:hover, button.primary:focus-visible { background: #ff8a3f; border-color: #ff8a3f; }
  .status { margin-top: 6px; min-height: 18px; color: var(--muted); }
  .status.bad { color: var(--bad); } .status.good { color: var(--good); }
  .on { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  ul { list-style: none; padding: 0; margin: 6px 0; max-height: 140px; overflow: auto; }
  li { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  li button { padding: 0 6px; }
  .hint { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
<h1><img src="icons/icon32.png" alt=""><span data-msg="name"></span></h1>
<label for="host" data-msg="consoleLabel"></label>
<div class="row"><input id="host" type="text" placeholder="192.168.0.9" spellcheck="false"><button id="test" data-msg="connect"></button></div>
<div class="status" id="hstatus"></div>
<label for="dest" data-msg="destLabel"></label>
<select id="dest"></select>
<div class="on"><input id="on" type="checkbox"><label for="on" style="margin:0;color:inherit" data-msg="onLabel"></label></div>
<div class="on"><input id="relay" type="checkbox"><label for="relay" style="margin:0;color:inherit" data-msg="relayLabel"></label></div>
<div class="hint" data-msg="relayHint"></div>
<hr>
<div id="basketbox">
  <strong data-msg="basketTitle"></strong>
  <div class="hint" data-msg="basketHint"></div>
  <ul id="basket"></ul>
  <label for="pw" data-msg="passwordLabel"></label>
  <input id="pw" type="text" autocomplete="off" spellcheck="false">
  <div class="row" style="margin-top:8px;justify-content:flex-end"><button id="clear" data-msg="clear"></button><button id="send" class="primary" data-msg="send"></button></div>
  <div class="status" id="bstatus"></div>
</div>
<hr>
<a id="open" href="#" data-msg="openPanel"></a>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
