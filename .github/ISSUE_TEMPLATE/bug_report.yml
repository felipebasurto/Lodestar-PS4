name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. All fields marked with * are needed to find the cause.
        Do not attach `.pkg` files or links to them.
  - type: input
    id: version
    attributes:
      label: Lodestar version
      description: Shown at the top of the web panel and in the startup notification.
      placeholder: "3.1.0-rc.3"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: PS4 firmware
      description: Settings > System > System Information.
      placeholder: "13.52"
    validations:
      required: true
  - type: textarea
    id: jailbreak
    attributes:
      label: GoldHEN and payload loader
      description: Include your GoldHEN version, how you load Lodestar, and other payloads running at the time.
      placeholder: |
        GoldHEN 2.4b18
        Lodestar from Payload Guest
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game
      description: Name and title ID (CUSAxxxxx) of the game, and whether it has an update (the version shown in the panel) and add-ons. Write "none" if the problem is not about a game.
      placeholder: "Bloodborne, CUSA00900, update 1.09, 1 add-on"
    validations:
      required: true
  - type: textarea
    id: drives
    attributes:
      label: Where the game is
      description: A USB drive (how it is formatted, how many are connected) or the console's storage (/data/Lodestar). Write "none" if the problem is unrelated to storage.
      placeholder: "1 USB SSD, exFAT, one partition"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and the exact message or error code shown on the console.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Open the web panel, click **Log** and copy the text, or download `/data/lodestar/log.txt` over FTP. Include the lines from when the problem happened. Remove private links, passwords, and personal data.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Screenshots taken on the console show more than photos of the TV.
    validations:
      required: false
