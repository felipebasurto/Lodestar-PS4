<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Lodestar: a compass star that guides external content toward the console.
    Dark navy tile, amber north-star sparkle, teal compass ring.
    No text; the silhouette stays readable down to 16 px.
    Regenerate the PNGs with: python3 assets/render_icons.py
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223a"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#060b15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#f5a524" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset="0.45" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#d97f06"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0e4"/>
      <stop offset="1" stop-color="#3ab3a6"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="5" y="5" width="502" height="502" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- compass ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#5fd3c7" stroke-opacity="0.38" stroke-width="7"/>

  <!-- cardinal ticks on the ring; the north one is amber, the one the star points to -->
  <g stroke-linecap="round">
    <path d="M256 64 v26" stroke="#f5a524" stroke-width="10"/>
    <path d="M256 422 v26" stroke="#5fd3c7" stroke-opacity="0.7" stroke-width="8"/>
    <path d="M64 256 h26" stroke="#5fd3c7" stroke-opacity="0.7" stroke-width="8"/>
    <path d="M422 256 h26" stroke="#5fd3c7" stroke-opacity="0.7" stroke-width="8"/>
  </g>
  <!-- intercardinal ticks, smaller -->
  <g stroke="#5fd3c7" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
    <path d="M120.3 120.3 l16.5 16.5"/>
    <path d="M391.7 120.3 l-16.5 16.5"/>
    <path d="M120.3 391.7 l16.5 -16.5"/>
    <path d="M391.7 391.7 l-16.5 -16.5"/>
  </g>

  <!-- the lodestar: a four-point sparkle with concave edges -->
  <path d="M256 96
           Q 288 224 416 256
           Q 288 288 256 416
           Q 224 288 96 256
           Q 224 224 256 96 Z"
        fill="url(#star)"/>
  <!-- slim highlight on the north point -->
  <path d="M256 96 Q 272 200 280 228 Q 264 204 256 120 Z" fill="#ffffff" fill-opacity="0.22"/>

  <!-- the core: where the guided content arrives, cut out of the star -->
  <circle cx="256" cy="256" r="34" fill="#0a1120"/>
  <circle cx="256" cy="256" r="22" fill="url(#core)"/>
</svg>
